# SWPUCAT 前端站点配置模板（宿主机 nginx）
#
# 用途：在服务器上手工安装的 nginx 中放置该配置，对外服务前端静态文件并
#       把 /api/ 转发到后端容器（经宿主机 127.0.0.1:8080）。
#
# 使用：复制到 /etc/nginx/conf.d/swpucat.conf，然后 `nginx -t && systemctl restart nginx`。
#   先确保 /opt/SWPUCAT/web/dist 已存在（见部署指南第 3 节）。
#   对应指南 3.1，与仓库内 docker 无关。

server {
    listen 80;
    server_name _;

    root /opt/SWPUCAT/web/dist;
    index index.html;

    # 已被 hash 的前端资源（/assets/）可长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # SPA 路由回退：交给 Vue Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 代理 API 到后端（后端路由都挂在 /api 下，前缀原样转发）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
