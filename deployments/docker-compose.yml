services:
  postgres:
    image: postgres:16-alpine
    container_name: swpucat-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CSA_DATABASE_USER:?set CSA_DATABASE_USER in .env}
      POSTGRES_PASSWORD: ${CSA_DATABASE_PASSWORD:?set CSA_DATABASE_PASSWORD in .env}
      POSTGRES_DB: ${CSA_DATABASE_DBNAME:?set CSA_DATABASE_DBNAME in .env}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    image: swpucat-server
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    container_name: swpucat-migrate
    restart: "no"
    environment:
      CSA_DATABASE_HOST: postgres
      CSA_DATABASE_PORT: 5432
      CSA_DATABASE_USER: ${CSA_DATABASE_USER:?set CSA_DATABASE_USER in .env}
      CSA_DATABASE_PASSWORD: ${CSA_DATABASE_PASSWORD:?set CSA_DATABASE_PASSWORD in .env}
      CSA_DATABASE_DBNAME: ${CSA_DATABASE_DBNAME:?set CSA_DATABASE_DBNAME in .env}
      CSA_DATABASE_SSLMODE: ${CSA_DATABASE_SSLMODE:-disable}
      CSA_MIGRATIONS_DIR: /app/migrations
      TZ: ${TZ:-Asia/Shanghai}
    command: ["./migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  server:
    image: swpucat-server
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    container_name: swpucat-server
    restart: unless-stopped
    environment:
      CSA_DATABASE_HOST: postgres
      CSA_DATABASE_PORT: 5432
      CSA_DATABASE_USER: ${CSA_DATABASE_USER:?set CSA_DATABASE_USER in .env}
      CSA_DATABASE_PASSWORD: ${CSA_DATABASE_PASSWORD:?set CSA_DATABASE_PASSWORD in .env}
      CSA_DATABASE_DBNAME: ${CSA_DATABASE_DBNAME:?set CSA_DATABASE_DBNAME in .env}
      CSA_DATABASE_SSLMODE: ${CSA_DATABASE_SSLMODE:-disable}
      CSA_DATABASE_MAX_OPEN_CONNS: ${CSA_DATABASE_MAX_OPEN_CONNS:-15}
      CSA_DATABASE_MAX_IDLE_CONNS: ${CSA_DATABASE_MAX_IDLE_CONNS:-3}
      CSA_JWT_ACCESS_SECRET: ${CSA_JWT_ACCESS_SECRET:?set CSA_JWT_ACCESS_SECRET in .env}
      CSA_JWT_REFRESH_SECRET: ${CSA_JWT_REFRESH_SECRET:?set CSA_JWT_REFRESH_SECRET in .env}
      CSA_STORAGE_UPLOAD_DIR: /app/uploads
      CSA_SERVER_MODE: ${CSA_SERVER_MODE:-release}
      CSA_LOG_LEVEL: ${CSA_LOG_LEVEL:-info}
      CSA_AGENT_BASE_URL: http://agent:8090
      CSA_AGENT_INTERNAL_SECRET: ${CSA_AGENT_INTERNAL_SECRET:-}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

  agent:
    image: swpucat-server
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    container_name: swpucat-agent
    restart: unless-stopped
    environment:
      CSA_AGENT_ENABLED: ${CSA_AGENT_ENABLED:-false}
      CSA_AGENT_WRITE_ENABLED: ${CSA_AGENT_WRITE_ENABLED:-false}
      CSA_AGENT_PORT: 8090
      CSA_SERVER_INTERNAL_URL: http://server:8080
      CSA_AGENT_INTERNAL_SECRET: ${CSA_AGENT_INTERNAL_SECRET:-}
      CSA_LLM_PROVIDER: ${CSA_LLM_PROVIDER:-openai_compatible}
      CSA_LLM_MODEL: ${CSA_LLM_MODEL:-}
      CSA_LLM_API_KEY: ${CSA_LLM_API_KEY:-}
      CSA_LLM_BASE_URL: ${CSA_LLM_BASE_URL:-}
      CSA_LLM_TIMEOUT: ${CSA_LLM_TIMEOUT:-60s}
      CSA_AGENT_MAX_ITERATIONS: ${CSA_AGENT_MAX_ITERATIONS:-4}
      CSA_AGENT_MAX_TOOL_CALLS: ${CSA_AGENT_MAX_TOOL_CALLS:-8}
      CSA_AGENT_WORKER_CONCURRENCY: ${CSA_AGENT_WORKER_CONCURRENCY:-1}
      CSA_SERVER_MODE: ${CSA_SERVER_MODE:-release}
      TZ: ${TZ:-Asia/Shanghai}
    # Agent is an internal service. The server reaches it over the Compose
    # network; do not expose the model/tool endpoint on the host interface.
    expose:
      - "8090"
    command: ["./agent"]

  web:
    image: node:20-alpine
    container_name: swpucat-web
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../web:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
    environment:
      NODE_ENV: development

volumes:
  postgres_data:
    name: swpucat_postgres_data
  uploads_data:
    name: swpucat_uploads_data

networks:
  default:
    name: swpucat_network
