server:
  port: 8080
  mode: release
  read_timeout: 10s
  write_timeout: 10s

database:
  host: localhost
  port: 5432
  user: csa
  password: ""
  dbname: csa_db
  sslmode: disable
  max_open_conns: 15
  max_idle_conns: 3

redis:
  addr: localhost:6379
  password: ""
  db: 0

jwt:
  access_secret: ""
  refresh_secret: ""
  access_expiry: 24h
  refresh_expiry: 720h

log:
  level: info
  format: console

agent:
  enabled: false
  write_enabled: false
  port: 8090
  base_url: http://localhost:8090
  server_url: http://localhost:8080
  internal_secret: ""
  llm_provider: openai_compatible
  llm_model: ""
  llm_api_key: ""
  llm_base_url: ""
  llm_timeout: 60s
  max_iterations: 4
  max_tool_calls: 8
  worker_concurrency: 1
